name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      note:
        description: Build revision
        required: false
        default: manual
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build installable debug APK
        run: dotnet publish Editor3D.csproj -f net10.0-android -c Debug -p:AndroidPackageFormat=apk
      - name: Upload APK immediately after successful build
        uses: actions/upload-artifact@v4
        with:
          name: Editor3D-Android-APK
          path: '**/bin/Debug/net10.0-android/publish/*-Signed.apk'
          if-no-files-found: error
          retention-days: 14
      - name: Launch app in Android emulator and verify 3D startup
        id: emulator_test
        continue-on-error: true
        timeout-minutes: 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb logcat -c
            APK=$(find bin/Debug/net10.0-android/publish -name '*-Signed.apk' -print -quit)
            test -n "$APK"
            adb install "$APK"
            adb shell monkey -p com.blopex67.editor3d 1
            sleep 12
            adb logcat -d -s EDITOR3D:I AndroidRuntime:E chromium:E > editor3d-startup-log.txt
            cat editor3d-startup-log.txt
            grep -q 'EDITOR3D_READY three-renderer-ready' editor3d-startup-log.txt
            ! grep -q 'FATAL EXCEPTION' editor3d-startup-log.txt
            adb shell screencap -p /sdcard/editor3d-emulator.png
            adb pull /sdcard/editor3d-emulator.png editor3d-emulator.png
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Editor3D-Android-emulator-diagnostics
          path: |
            editor3d-startup-log.txt
            editor3d-emulator.png
          if-no-files-found: ignore
          retention-days: 7
