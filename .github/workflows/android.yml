name: Build and validate Editor3D Android APK

on:
  workflow_dispatch:
    inputs:
      note:
        description: Build note
        required: false
        default: manual

permissions:
  contents: read

concurrency:
  group: editor3d-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and inspect APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build APK and capture build log
        shell: bash
        env:
          BUILD_NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          echo "Commit: $GITHUB_SHA" | tee artifacts/validation.txt
          echo "Build note: $BUILD_NOTE" | tee -a artifacts/validation.txt
          dotnet publish Editor3D.csproj \
            --framework net10.0-android \
            --configuration Debug \
            -p:AndroidPackageFormat=apk \
            2>&1 | tee artifacts/build.log

      - name: Verify APK integrity and Android package identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find bin/Debug/net10.0-android/publish -type f -name '*-Signed.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo 'ERROR: Signed APK not found.' | tee -a artifacts/validation.txt
            exit 1
          fi
          echo "APK path: $APK" | tee -a artifacts/validation.txt
          echo "APK SHA-256: $(sha256sum "$APK" | awk '{print $1}')" | tee -a artifacts/validation.txt
          unzip -t "$APK" | tail -n 2 | tee -a artifacts/validation.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$AAPT" ]]; then
            echo 'ERROR: Android aapt tool not found.' | tee -a artifacts/validation.txt
            exit 1
          fi
          "$AAPT" dump badging "$APK" > artifacts/apk-badging.txt
          grep "package: name='com.blopex67.editor3d'" artifacts/apk-badging.txt
          grep "package: name='com.blopex67.editor3d'" artifacts/apk-badging.txt >> artifacts/validation.txt
          cp "$APK" artifacts/Editor3D-Android.apk
          echo 'APK archive and package identity checks passed.' | tee -a artifacts/validation.txt

      - name: Upload APK and build report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Editor3D-Android-APK
          path: |
            artifacts/Editor3D-Android.apk
            artifacts/validation.txt
            artifacts/apk-badging.txt
          if-no-files-found: error
          retention-days: 14

      - name: Preserve build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Editor3D-Android-build-diagnostics
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
